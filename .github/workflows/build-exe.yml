name: Build Windows EXE

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build portable GUI
        shell: powershell
        run: .\build\Build-PortableExe.ps1 -Version '0.2.0'
      - name: Verify embedded resources
        shell: powershell
        run: .\tests\Test-PortableExe.ps1 -Path '.\dist\ZZZ-IPv6-Router-v0.2.0-windows.exe'
      - uses: actions/upload-artifact@v4
        with:
          name: ZZZ-IPv6-Router-Windows
          path: |
            dist/*.exe
            dist/*.sha256

  publish-release-assets:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ZZZ-IPv6-Router-Windows
          path: dist
      - name: Attach EXE and checksum to release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Get-ChildItem -LiteralPath .\dist -File | ForEach-Object {
            gh release upload "${{ github.ref_name }}" $_.FullName --clobber --repo "${{ github.repository }}"
          }
