name: PowerShell checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  syntax:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Parse PowerShell scripts
        shell: pwsh
        run: ./tests/Test-ScriptSyntax.ps1
      - name: Verify safe DNS fallback
        shell: powershell
        run: .\tests\Test-Fallback.ps1
